<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">ATCHAY — Blackbox 07</title>
  <desc id="desc">A futuristic dark terminal identity banner for Atchay, a full-stack and AI developer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a12"/>
      <stop offset="0.55" stop-color="#091521"/>
      <stop offset="1" stop-color="#061018"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2bf5c5" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#55e6ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#2bf5c5" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2ffff"/>
      <stop offset=".48" stop-color="#aaf9ec"/>
      <stop offset="1" stop-color="#51cdbd"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#35f5cb" stop-opacity=".22"/>
      <stop offset="1" stop-color="#35f5cb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7ce8df" stroke-opacity=".075" stroke-width="1"/>
      <circle cx="0" cy="0" r="1" fill="#77eadd" fill-opacity=".18"/>
    </pattern>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect x="12" y="12" width="1176" height="416" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="440" fill="url(#bg)"/>
    <rect width="1200" height="440" fill="url(#grid)"/>
    <circle cx="525" cy="220" r="360" fill="url(#orb)"/>
    <circle cx="1080" cy="70" r="190" fill="url(#orb)" opacity=".65"/>

    <!-- Outer frame and header -->
    <rect x="12" y="12" width="1176" height="416" rx="18" fill="none" stroke="#4ee8d0" stroke-opacity=".62" stroke-width="1.4"/>
    <path d="M12 68H1188" stroke="url(#edge)" stroke-width="1.5"/>
    <path d="M40 12V29H58M1142 12V29H1160" fill="none" stroke="#55f5d1" stroke-width="2" stroke-opacity=".7"/>
    <circle cx="42" cy="40" r="5" fill="#53f5c4" filter="url(#softGlow)"/>
    <text x="60" y="45" fill="#9cf6e7" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="2">BLACKBOX / IDENTITY CORE</text>
    <text x="845" y="44" fill="#668e91" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="1.5">NODE: ATCHAYRM</text>
    <rect x="1052" y="27" width="104" height="25" rx="12.5" fill="#0d2c2a" stroke="#38d9b8" stroke-opacity=".7"/>
    <circle cx="1067" cy="39.5" r="3.5" fill="#53f5c4"/>
    <text x="1078" y="44" fill="#73f4d5" font-family="Consolas, 'Courier New', monospace" font-size="10" letter-spacing="1">ONLINE</text>

    <!-- Left index rail -->
    <path d="M54 104V371" stroke="#2c7774" stroke-opacity=".75" stroke-width="1"/>
    <path d="M47 118H61M47 154H61M47 190H61M47 226H61M47 262H61M47 298H61M47 334H61" stroke="#53e9ce" stroke-opacity=".55"/>
    <text x="38" y="390" transform="rotate(-90 38 390)" fill="#477b7b" font-family="Consolas, 'Courier New', monospace" font-size="9" letter-spacing="2">PERSONAL SYSTEM PROFILE</text>

    <!-- Main identity -->
    <text x="94" y="135" fill="#55e8ce" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="4">INDEPENDENT DEVELOPER  /  INDIA</text>
    <text x="88" y="241" fill="#40f0cc" opacity=".35" filter="url(#glow)" font-family="Arial Black, Impact, sans-serif" font-size="104" font-weight="900" letter-spacing="2">ATCHAY</text>
    <text x="88" y="241" fill="url(#nameFill)" stroke="#d2fff7" stroke-opacity=".5" stroke-width=".7" font-family="Arial Black, Impact, sans-serif" font-size="104" font-weight="900" letter-spacing="2">ATCHAY</text>
    <path d="M96 258H690" stroke="url(#edge)" stroke-width="2"/>
    <text x="98" y="292" fill="#e1fff9" font-family="Consolas, 'Courier New', monospace" font-size="19" letter-spacing="2">FULL STACK <tspan fill="#45eac8">×</tspan> AI DEVELOPER</text>
    <text x="98" y="326" fill="#86aaa9" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="1.2">TURNING IDEAS INTO WORKING PRODUCTS.</text>

    <!-- Project signal strip -->
    <g transform="translate(98 357)">
      <rect width="105" height="28" rx="5" fill="#0c282a" stroke="#287c72"/>
      <text x="52.5" y="18" text-anchor="middle" fill="#8af6df" font-family="Consolas, 'Courier New', monospace" font-size="10" letter-spacing="1">CRICKROOM</text>
      <rect x="116" width="83" height="28" rx="5" fill="#0c222c" stroke="#286d7c"/>
      <text x="157.5" y="18" text-anchor="middle" fill="#8ceaff" font-family="Consolas, 'Courier New', monospace" font-size="10" letter-spacing="1">CHAYVA</text>
      <rect x="210" width="112" height="28" rx="5" fill="#0c282a" stroke="#287c72"/>
      <text x="266" y="18" text-anchor="middle" fill="#8af6df" font-family="Consolas, 'Courier New', monospace" font-size="10" letter-spacing="1">RETRIVE DAD</text>
    </g>

    <!-- Right HUD card -->
    <path d="M760 104H1149V377H760L746 363V118Z" fill="#08151e" fill-opacity=".88" stroke="#2c7774" stroke-width="1.2"/>
    <path d="M760 104H1149" stroke="#50efd0" stroke-width="2"/>
    <text x="786" y="135" fill="#55efd0" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2">// TELEMETRY</text>
    <text x="1119" y="135" text-anchor="end" fill="#527d80" font-family="Consolas, 'Courier New', monospace" font-size="10">07.01</text>
    <path d="M784 151H1125" stroke="#24504f"/>

    <g font-family="Consolas, 'Courier New', monospace">
      <text x="786" y="181" fill="#5e9994" font-size="10" letter-spacing="1.4">PRIMARY DIRECTIVE</text>
      <text x="786" y="204" fill="#e3fff9" font-size="16">BUILD / EXPLORE / SHIP</text>
      <text x="786" y="241" fill="#5e9994" font-size="10" letter-spacing="1.4">CURRENT INTERESTS</text>
      <text x="786" y="263" fill="#a9d8d1" font-size="13">Applied AI · Web Engineering</text>
      <text x="786" y="283" fill="#a9d8d1" font-size="13">Scalable Backends · Product Design</text>
      <text x="786" y="320" fill="#5e9994" font-size="10" letter-spacing="1.4">SYSTEM STATUS</text>
      <circle cx="792" cy="344" r="4" fill="#53f5c4" filter="url(#softGlow)"/>
      <text x="806" y="348" fill="#70f0d2" font-size="12">LEARNING IN PUBLIC</text>
      <text x="1121" y="348" text-anchor="end" fill="#477e7a" font-size="10">[ ACTIVE ]</text>
    </g>

    <!-- Circuit traces -->
    <g fill="none" stroke="#42cdb7" stroke-opacity=".42" stroke-width="1.2">
      <path d="M690 180H722V164H746"/><path d="M700 306H728V326H746"/>
      <path d="M1149 166H1170V184H1188"/><path d="M1149 310H1171V292H1188"/>
    </g>
    <g fill="#58f4d5"><circle cx="722" cy="180" r="2.5"/><circle cx="728" cy="306" r="2.5"/><circle cx="1170" cy="184" r="2.5"/><circle cx="1171" cy="292" r="2.5"/></g>

    <!-- Footer -->
    <path d="M12 402H1188" stroke="#286b68" stroke-opacity=".7"/>
    <text x="42" y="418" fill="#477b7b" font-family="Consolas, 'Courier New', monospace" font-size="9" letter-spacing="1.5">THINK DIFFERENTLY. BUILD RELENTLESSLY.</text>
    <text x="1158" y="418" text-anchor="end" fill="#477b7b" font-family="Consolas, 'Courier New', monospace" font-size="9" letter-spacing="1.5">BBX-07 / 2026</text>
  </g>
</svg>
